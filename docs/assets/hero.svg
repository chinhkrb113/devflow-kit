<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="hero-title hero-desc" id="hero-root"><title id="hero-title">DevFlow Kit</title><desc id="hero-desc">DevFlow Kit organizes eight complementary skills into a reference-led workflow from requirements to technical verification.</desc><defs>
