<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root"><title id="workflow-title">DevFlow Kit development flow</title><desc id="workflow-desc">Five phases group requirements and references, specifications, interactive mock and feedback, optional reverse and implementation, then verification and acceptance.</desc><defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #workflow-root { color: #202936; }
      #workflow-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#workflow-root .diagram-container { overflow:visible }
}</style><marker id="workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#58616b"/></marker></defs><rect width="1280" height="720" fill="#faf9f6"/><text x="48" y="40" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">DEVFLOW KIT / 02 / DEVELOPMENT FLOW</text><text x="48" y="96" font-family="'Instrument Serif',Georgia,serif" font-size="40" font-weight="400" fill="#202936" text-anchor="start">From an open question to an accepted outcome.</text><line x1="48" y1="120" x2="1232" y2="120" stroke="#d9d9d4" stroke-width="1"/><path d="M380 192 H412" fill="none" stroke="#58616b" stroke-width="1.2" marker-end="url(#workflow-arrow)"/><path d="M584 192 H616" fill="none" stroke="#58616b" stroke-width="1.2" marker-end="url(#workflow-arrow)"/><path d="M788 192 H820" fill="none" stroke="#58616b" stroke-width="1.2" marker-end="url(#workflow-arrow)"/><path d="M992 192 H1024" fill="none" stroke="#58616b" stroke-width="1.2" marker-end="url(#workflow-arrow)"/><text x="228" y="164" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">01</text><text x="228" y="192" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600" fill="#202936" text-anchor="start">Understand</text><line x1="404" y1="240" x2="404" y2="572" stroke="#d9d9d4" stroke-width="1"/><text x="432" y="164" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">02</text><text x="432" y="192" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600" fill="#202936" text-anchor="start">Specify</text><line x1="608" y1="240" x2="608" y2="572" stroke="#d9d9d4" stroke-width="1"/><text x="636" y="164" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">03</text><text x="636" y="192" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600" fill="#3659a8" text-anchor="start">Prototype</text><line x1="636" y1="212" x2="792" y2="212" stroke="#3659a8" stroke-width="1"/><line x1="812" y1="240" x2="812" y2="572" stroke="#d9d9d4" stroke-width="1"/><text x="840" y="164" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">04</text><text x="840" y="192" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600" fill="#202936" text-anchor="start">Implement</text><line x1="1016" y1="240" x2="1016" y2="572" stroke="#d9d9d4" stroke-width="1"/><text x="1044" y="164" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">05</text><text x="1044" y="192" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600" fill="#202936" text-anchor="start">Verify &amp; accept</text><text x="48" y="276" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">WORK</text><text x="48" y="388" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">CONSTRAINT</text><text x="48" y="500" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">OUTPUT</text><line x1="48" y1="316" x2="1232" y2="316" stroke="#d9d9d4" stroke-width="1"/><line x1="48" y1="428" x2="1232" y2="428" stroke="#d9d9d4" stroke-width="1"/><line x1="48" y1="572" x2="1232" y2="572" stroke="#d9d9d4" stroke-width="1"/><text x="228" y="264" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Clarify the need</text><text x="228" y="288" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Compare references</text><text x="228" y="376" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Check fit, rights</text><text x="228" y="400" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">and feasibility</text><text x="228" y="488" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Brief + shortlist</text><text x="228" y="512" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Known assumptions</text><text x="432" y="264" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Define scope</text><text x="432" y="288" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">and behavior</text><text x="432" y="376" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Make acceptance</text><text x="432" y="400" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">criteria explicit</text><text x="432" y="488" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Specification</text><text x="432" y="512" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">and test criteria</text><text x="636" y="264" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Build clickable UI</text><text x="636" y="288" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Review and refine</text><text x="636" y="376" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Keep approved</text><text x="636" y="400" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">brand and stack</text><text x="636" y="488" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Interactive mock</text><text x="636" y="512" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Accepted direction</text><text x="840" y="264" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Reverse if needed</text><text x="840" y="288" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Build agreed scope</text><text x="840" y="376" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Use only authorized</text><text x="840" y="400" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">observable behavior</text><text x="840" y="488" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Working system</text><text x="840" y="512" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">and focused tests</text><text x="1044" y="264" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Run real checks</text><text x="1044" y="288" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#202936" text-anchor="start">Record acceptance</text><text x="1044" y="376" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Separate technical</text><text x="1044" y="400" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">and human sign-off</text><text x="1044" y="488" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Evidence + decision</text><text x="1044" y="512" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="400" fill="#58616b" text-anchor="start">Open limitations</text><text x="48" y="612" font-family="'Instrument Serif',Georgia,serif" font-size="14" font-weight="400" fill="#202936" text-anchor="start" font-style="italic">Small fix? Enter at the relevant stage. Reuse approved decisions; verify the affected interaction.</text><line x1="48" y1="656" x2="1232" y2="656" stroke="#d9d9d4" stroke-width="1"/><text x="48" y="684" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#58616b" text-anchor="start">REVERSE IS OPTIONAL / MOCK DATA IS NOT A BACKEND</text><text x="1232" y="684" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#58616b" text-anchor="end">REQUIREMENTS → ACCEPTANCE</text></svg>
