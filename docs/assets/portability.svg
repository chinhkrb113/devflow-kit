<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="portability-title portability-desc" id="portability-root"><title id="portability-title">DevFlow Kit portable installation</title><desc id="portability-desc">The installer copies one complete devflow capsule into a selected harness, with separate file, discovery, activation, execution and outcome checks.</desc><defs>
