ont-size="12" font-weight="400" fill="#58616b" text-anchor="start">Catalog, APIs, products</text><text x="84" y="228" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#58616b" text-anchor="start">License + fit checked</text></g><g data-node="UI craft"><rect x="404" y="128" width="332" height="112" fill="#faf9f6"/><rect x="408" y="132" width="324" height="104" rx="6" fill="#fff" stroke="#58616b" stroke-width="1"/><text x="428" y="156" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">DESIGN / FOUR SKILLS</text><text x="428" y="184" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600" fill="#202936" text-anchor="start">UI craft</text><text x="428" y="208" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#58616b" text-anchor="start">Frontend Design + UI/UX Pro Max</text><text x="428" y="228" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#58616b" text-anchor="start">Taste + UI Taste</text></g><g data-node="Your AI harness"><rect x="60" y="308" width="256" height="104" fill="#faf9f6"/><rect x="64" y="312" width="248" height="96" rx="6" fill="#fff" stroke="#58616b" stroke-width="1"/><text x="84" y="336" font-family="'Geist Mono',ui-monospace,monospace" font-size="8" font-weight="500" fill="#58616b" text-anchor="start">EXECUTION OWNER</text><text x="84" y="364" font-family="'Geist',system-ui,sans-serif" font-size="16" font-weight="600" fill="#202936" text-anchor="start">Your AI harness</text><text x="84" y="388" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" fill="#58616b" text-anchor="start">Reads files; invokes tools</text></g><g data-node="devflow"><rect x="424" y="308" width="272" height="104" fill="#faf9f6"/><rect x="428" y="312" width="264" height="96" rx="6" fill="#edf0f7" stroke="#3659a8" stroke-width="1"/><text x="448" 