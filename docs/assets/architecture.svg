<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root"><title id="architecture-title">DevFlow Kit architecture</title><desc id="architecture-desc">The harness reads the devflow router, selects design or engineering guidance, optionally uses references and Caveman, and produces project artifacts.</desc><defs>
